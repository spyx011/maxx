<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAXX — Intelligence</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="particles"></div>

    <div class="app">
      <!-- TOP BAR -->
      <header>
        <div class="brand">
          <div class="logo">M</div>

          <div>
            <h1>MAXX</h1>
            <div class="status">
              <span class="status-dot"></span>
              SYSTEM ONLINE
            </div>
          </div>
        </div>

        <div class="top-actions">
          <div class="clock" id="clock">00:00:00</div>
          <button id="clearBtn">CLEAR</button>
        </div>
      </header>

      <!-- AI CORE -->
      <section class="core">
        <div class="core-ring ring1"></div>
        <div class="core-ring ring2"></div>
        <div class="core-ring ring3"></div>

        <div class="core-orb">
          <span>M</span>
        </div>

        <div class="core-text">
          <strong>MAXX CORE</strong>
          <small>READY FOR COMMAND</small>
        </div>
      </section>

      <!-- CHAT -->
      <main id="chat">
        <div class="welcome">
          <div class="welcome-title">What are we building?</div>

          <p>I'm MAXX — your AI intelligence system.</p>

          <div class="suggestions">
            <button>Explain quantum physics</button>
            <button>Give me a coding idea</button>
            <button>Help me build something</button>
          </div>
        </div>
      </main>

      <!-- INPUT -->
      <div class="input-container">
        <div class="input-box">
          <textarea
            id="message"
            placeholder="Ask MAXX anything..."
            rows="1"
          ></textarea>

          <button id="sendBtn" class="send">↑</button>
        </div>

        <div class="input-info">
          <span>MAXX INTELLIGENCE</span>
          <span>ENTER ↵ TO SEND</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
